name: Deploy to Production Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install sshpass
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass

      - name: Deploy to server
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          sshpass -p "$SERVER_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -p $SERVER_PORT \
            $SERVER_USER@$SERVER_IP << 'ENDSSH'
          
            echo "🚀 Mulai deployment di server $HOSTNAME"

            # Load NVM (non-interaktif)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd /home/cuanku-pm2/htdocs/cuanku.web.id || exit 1

            echo "🔄 Backup kode lama..."
            BACKUP_DIR="../backup/cuanku_$(date +%Y%m%d%H%M%S)"
            mkdir -p "$BACKUP_DIR"
            cp -r . "$BACKUP_DIR"

            echo "🔄 Pull kode terbaru"
            git reset --hard
            git pull origin main

            echo "📦 Install dependencies Laravel"
            composer install --no-dev --optimize-autoloader
            composer dump-autoload --optimize

            echo "📦 Install dan build frontend"
            npm ci
            npm run build

            echo "🔐 Permissions & ownership"
            chown -R cuanku-pm2:cuanku-pm2 .
            chmod -R 775 storage bootstrap/cache

            echo "⚙️ Artisan clear cache & optimize"
            php artisan down
            php artisan clear-compiled
            php artisan optimize:clear
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize
            php artisan up

            echo "🔁 PM2 - Laravel Serve"
            if pm2 list | grep -q "cuanku-app"; then
              pm2 restart cuanku-app
            else
              pm2 start php --name cuanku-app -- artisan serve --host=127.0.0.1 --port=8000
            fi

            echo "🔁 PM2 - Queue Worker"
            if pm2 list | grep -q "cuanku-queue"; then
              pm2 restart cuanku-queue
            else
              pm2 start php --name cuanku-queue -- artisan queue:work --tries=3 --timeout=90
            fi

            echo "💾 PM2 startup persistence"
            pm2 save
            pm2 startup

            echo "📊 PM2 Status"
            pm2 status

            echo "✅ Deployment sukses!"
          ENDSSH


